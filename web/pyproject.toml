[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rechnungsblatt-web"
version = "0.1.0"
description = "Web-Schicht von Rechnungsblatt: öffentliche Seite, Konten und Mandanten-Arbeitsbereich (Einrichtung, Rechnungsformular, Ablage) über dem Kern."
requires-python = ">=3.11"
dependencies = [
    "rechnungsblatt-kern",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "psycopg[binary,pool]>=3.1",
    # AES-256-GCM fuer die Mandantendaten. Bewusst eine Bibliothek statt
    # Eigenbau: die Standardbibliothek hat scrypt, aber keine Blockchiffre.
    "cryptography>=42",
    # Zahlungen. Bewusst die offizielle Bibliothek statt Eigenbau:
    # Signaturpruefung und API-Versionierung will bei Zahlungsverkehr
    # niemand selbst pflegen.
    "stripe>=9",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
