name: CI

# Bewusst NUR manuell startbar (Actions-Minuten kosten Geld; getestet wird
# lokal — Kern-Tests und Mustang-Validierung laufen vor jedem Push).
# Bei Bedarf: GitHub → Actions → CI → "Run workflow".
on:
  workflow_dispatch:

jobs:
  kern-tests:
    name: Kern-Tests (Logik + Pipeline) und Web-Tests (Konten, Mandanten)
    runs-on: ubuntu-latest
    services:
      # Die Web-Tests brauchen eine echte Datenbank; ohne sie überspringt
      # conftest.py sie stillschweigend, und der Mandantenumbau bliebe ungeprüft.
      datenbank:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rechnungsblatt
          POSTGRES_PASSWORD: rechnungsblatt
          POSTGRES_DB: rechnungsblatt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rechnungsblatt -d rechnungsblatt"
          --health-interval 10s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Systempakete (Ghostscript, Ersatzschriften)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ghostscript fonts-liberation fonts-dejavu-core \
            fonts-crosextra-carlito fonts-crosextra-caladea libzbar0
      - name: Kern und Web installieren
        run: pip install -e "./kern[test]" -e "./web[test]" pyzbar pillow
      - name: Tests
        env:
          TEST_DATENBANK_URL: postgresql://rechnungsblatt:rechnungsblatt@127.0.0.1:5432/rechnungsblatt
        run: python -m pytest kern/tests web/tests -v

  referenz-validierung:
    name: Referenzfälle gegen Mustang-Validator (PDF/A-3B + EN 16931)
    runs-on: ubuntu-latest
    needs: kern-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Systempakete (Ghostscript, Ersatzschriften)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ghostscript fonts-liberation fonts-dejavu-core \
            fonts-crosextra-carlito fonts-crosextra-caladea
      - name: Kern installieren
        run: pip install -e ./kern
      - name: Validator laden (Cache)
        id: validator-cache
        uses: actions/cache@v4
        with:
          path: validator.jar
          key: mustang-validator-2.9.0
      - name: Validator herunterladen
        if: steps.validator-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL -o validator.jar \
            https://repo1.maven.org/maven2/org/mustangproject/validator/2.9.0/validator-2.9.0-shaded.jar
      - name: Wrapper kompilieren
        run: javac -cp validator.jar validator/Val.java -d .
      - name: Referenzfälle erzeugen
        run: python scripts/erzeuge_referenzfaelle.py referenzfaelle
      - name: Referenzfälle validieren
        run: python scripts/pruefe_referenzfaelle.py referenzfaelle --jar validator.jar --klasse .
      - name: Referenzfälle als Artefakt sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: referenzfaelle
          path: referenzfaelle/
