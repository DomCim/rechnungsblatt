name: Veröffentlichen

# Baut das Container-Image und schiebt es in die GitHub Container Registry.
#
# Läuft bei jedem Push auf main — also nach jedem Release-PR aus develop —
# und zusätzlich auf Knopfdruck. Das kostet Actions-Minuten je Release;
# bewusst in Kauf genommen, damit der veröffentlichte Stand ein eindeutig
# getaggtes Image ist statt eines Builds auf dem Zielsystem.
#
# ACHTUNG: Ein Push hierher rollt nichts aus. Das Ausrollen bleibt ein
# bewusster Schritt in Portainer (Stack neu deployen, zieht das Image).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  image:
    name: Image bauen und in die Registry schieben
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Imagename bestimmen (Registry verlangt Kleinschreibung)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: An der Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Marken vergeben
        id: marken
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
            type=raw,value={{date 'YYYY-MM-DD'}}

      - name: Bauen und schieben
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.marken.outputs.tags }}
          labels: ${{ steps.marken.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Zusammenfassung
        run: |
          {
            echo "### Image veröffentlicht"
            echo
            echo '```'
            echo "${{ steps.marken.outputs.tags }}"
            echo '```'
            echo
            echo "Ausgerollt ist damit noch nichts — dafür in Portainer den"
            echo "Stack neu deployen."
          } >> "$GITHUB_STEP_SUMMARY"
