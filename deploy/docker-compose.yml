# Rechnungsblatt als Portainer-Stack.
#
# Voraussetzungen im Zielsystem:
#   - Traefik läuft und hängt im externen Docker-Netz "edge". Davor steht
#     der Nginx Proxy Manager als Eintrittspunkt: Er hält das Zertifikat
#     und reicht per HTTP an Traefik weiter, der auf die Container verteilt
#     (eine Docker-Sock für alle Stacks). Deshalb hat der Router hier kein
#     TLS-Label — verschlüsselt wird eine Schicht davor.
#   - Zugriff auf ghcr.io/domcim/rechnungsblatt: Ist das Paket privat,
#     braucht Portainer eine Registry-Anmeldung (GitHub-Benutzer +
#     Personal Access Token mit read:packages). Alternativ das Paket in
#     GitHub auf öffentlich stellen.
#   - Stack-Umgebungsvariablen sind gesetzt:
#       RECHNUNGSBLATT_DOMAIN   z. B. rechnungsblatt.example.de
#       DB_PASSWORT             Passwort der Datenbank — nur Buchstaben und
#                               Ziffern, keine Sonderzeichen: der Wert steht
#                               in DATENBANK_URL, wo @ : / # % die URL
#                               zerlegen würden. Länge statt Sonderzeichen.
#       ADMIN_EMAIL             Anmeldung des ersten Admins
#       ADMIN_PASSWORT          dessen Startpasswort — nach der ersten
#                               Anmeldung unter „Konto“ ändern
#
# Die App bringt seit dem Mandantenumbau eine eigene Anmeldung mit; die
# frühere BasicAuth-Notlösung vor Traefik ist damit hinfällig. Öffentlich
# erreichbar ist nur noch die Startseite und die Anmeldung, alles unter
# /app und /api verlangt ein freigeschaltetes Konto.
#
# Neue Registrierungen stehen auf „wartet“ und müssen im Adminbereich
# (/app/verwaltung) freigeschaltet werden.

services:
  datenbank:
    image: postgres:16-alpine
    container_name: rechnungsblatt-db
    restart: unless-stopped
    networks:
      - intern
    environment:
      POSTGRES_USER: rechnungsblatt
      POSTGRES_DB: rechnungsblatt
      POSTGRES_PASSWORD: ${DB_PASSWORT:?DB_PASSWORT muss im Stack gesetzt sein}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rechnungsblatt -d rechnungsblatt"]
      interval: 10s
      timeout: 5s
      retries: 12

  rechnungsblatt:
    # Fertiges Image aus der Registry — gebaut vom Workflow
    # „Veröffentlichen" bei jedem Push auf main. RECHNUNGSBLATT_VERSION
    # setzen, um auf einen bestimmten Stand festzunageln (Marke oder
    # sha-<commit>); ohne Angabe läuft der jeweils letzte main-Stand.
    image: ghcr.io/domcim/rechnungsblatt:${RECHNUNGSBLATT_VERSION:-latest}
    pull_policy: always
    container_name: rechnungsblatt
    restart: unless-stopped
    depends_on:
      datenbank:
        condition: service_healthy
    networks:
      - edge
      - intern
    volumes:
      - daten:/daten
    environment:
      DATENBANK_URL: postgresql://rechnungsblatt:${DB_PASSWORT}@datenbank:5432/rechnungsblatt
      # Beim ersten Start wird dieses Konto als Admin angelegt und
      # freigeschaltet. Existiert es bereits, bleibt sein Passwort
      # unangetastet — ein Neustart dreht eine Änderung also nicht zurück.
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL muss im Stack gesetzt sein}
      ADMIN_PASSWORT: ${ADMIN_PASSWORT:?ADMIN_PASSWORT muss im Stack gesetzt sein (mind. 10 Zeichen)}
      # Verschlüsselt Betriebsgeheimnisse in der Datenbank — derzeit das
      # SMTP-Passwort. Einmal setzen und NIE ändern: mit einem neuen
      # Schlüssel ist der alte Wert nicht mehr lesbar und muss neu
      # eingetragen werden. Lange Zufallskette, etwa aus
      #   openssl rand -base64 32
      RECHNUNGSBLATT_SCHLUESSEL: ${RECHNUNGSBLATT_SCHLUESSEL:?RECHNUNGSBLATT_SCHLUESSEL muss im Stack gesetzt sein}
      # Plausible: Skript wird nur eingebunden, wenn beide Werte gesetzt sind.
      #
      # **Die INTERNE Adresse**, etwa `http://plausible:8000` — nicht eine
      # öffentliche. Der Browser des Besuchers spricht Plausible nie direkt
      # an: Er holt sein Skript unter `/statistik/zaehler.js` von dieser
      # Domain, und Rechnungsblatt reicht die Zählung nach innen weiter
      # (siehe `web/src/rechnungsblatt_web/zaehler.py`). `http` genügt also,
      # und ein Werbeblocker erkennt nichts an der Adresse.
      #
      # Bis zum 01.09.2026 stand hier die Adresse eines fremden Containers,
      # die der Browser weder auflösen konnte noch über HTTPS erreichte —
      # gezählt wurde nichts, und auf jeder Seite stand ein Mixed-Content-
      # Fehler in der Konsole.
      #
      # Diese Variable ist nur der Rückfall: Steht im Adminbereich unter
      # „Zählung" eine Adresse, gewinnt die.
      #
      # Damit Rechnungsblatt Plausible erreicht, muss der Plausible-Stack
      # im Netz `rechnungsblatt_intern` mitfahren — siehe unten.
      PLAUSIBLE_URL: ${PLAUSIBLE_URL:-}
      PLAUSIBLE_DOMAIN: ${RECHNUNGSBLATT_DOMAIN:-}
    labels:
      traefik.enable: "true"
      traefik.docker.network: edge
      traefik.http.routers.rechnungsblatt.rule: Host(`${RECHNUNGSBLATT_DOMAIN}`)
      # Eintrittspunkt `web`, nicht `websecure`: Vor Traefik steht der Nginx
      # Proxy Manager, der das Zertifikat hält und intern per HTTP
      # weiterreicht. Ein TLS-Label hier verlangte ein zweites Zertifikat
      # für eine Strecke, die den Rechner nie verlässt.
      #
      # Gleiche Schreibweise wie in den Stacks DiD0m-Verwaltung und
      # vh-website — wer die Kette einmal umbaut, setzt TRAEFIK_ENTRYPOINT
      # und muss keine Datei anfassen.
      traefik.http.routers.rechnungsblatt.entrypoints: ${TRAEFIK_ENTRYPOINT:-web}
      # Priorität ausdrücklich setzen, nicht Traefik raten lassen.
      #
      # Ohne Angabe vergibt Traefik sie nach der LÄNGE der Regel — eine
      # Host-Regel kommt damit auf etwa 20-30. Ein übriggebliebener
      # Container aus einem vorigen Stack bediente dann womöglich weiter
      # alles, und man sähe den alten Stand ohne jede Fehlermeldung.
      traefik.http.routers.rechnungsblatt.priority: "100"
      traefik.http.services.rechnungsblatt.loadbalancer.server.port: "8000"

volumes:
  daten:
  db:

networks:
  edge:
    external: true
  # Datenbank und App unter sich. Portainer nennt es nach dem Stack, bei
  # einem Stack namens „rechnungsblatt" also `rechnungsblatt_intern`.
  #
  # Dieser Name ist die Anschrift für die Besucherzählung: Der
  # Plausible-Stack trägt ihn als `external: true` ein und fährt hier mit.
  #
  # **Die Richtung ist Absicht.** Plausible hängt sich hier ein, nicht
  # umgekehrt: Angelegt wird das Netz von diesem Stack, der andere benutzt
  # es nur mit. Fiele die Statistik aus, fehlte Rechnungsblatt nichts —
  # andersherum könnte ein Fehler im Zähler das Ausrollen der Rechnungen
  # aufhalten, und ein Betrieb schreibt keine Rechnungen mehr, weil der
  # Besucherzähler hakt. Dasselbe Muster wie bei vh-website.
  intern:
